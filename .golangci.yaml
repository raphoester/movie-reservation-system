version: "2"

run:
  build-tags:
    - integration

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - sloglint
    - bodyclose
    - wrapcheck
    - nilnil
    - exhaustruct

    # Style
    - revive

    # Error handling - errors.Is/As
    - errorlint

    # Slice allocation - requires make([]T, 0, cap) + append
    - prealloc

    # Testing quality
    - testifylint
    - usetesting

    # Security
    - gosec

    # Code quality
    - unconvert
    - gocritic
    - noctx

  settings:
    unused:
      exported-fields-are-used: false
    revive:
      rules:
        - name: error-return # error should be last return value
        - name: error-naming # error vars should start with Err
        - name: error-strings # error strings: not capitalized, no trailing punctuation
        - name: if-return # simplify redundant if-return patterns
        - name: increment-decrement # use i++ instead of i += 1
        - name: var-naming # Go naming conventions
        - name: receiver-naming # consistent receiver names across methods
        - name: unexported-return # warn on unexported types in exported signatures
        - name: unused-parameter # flag unused function parameters
        - name: range # proper range loop usage
        - name: time-naming # duration fields should not be suffixed with units
        - name: early-return # prefer early returns to reduce nesting

    errorlint:
      errorf: true # check fmt.Errorf wrapping uses %w
      errorf-multi: true # check multi-error wrapping
      asserts: true # check type assertions on errors
      comparison: true # check == comparisons against error values

    wrapcheck:
      extra-ignore-sigs:
        - .ConvertError(
        - .NewNotFoundError(
        - .Check(
        - .Close(
        - .Validate(
        - status.Error(
        - json.Unmarshal(
        - json.Marshal(

    usetesting:
      os-setenv: true
      os-temp-dir: true
      context-background: true

    testifylint:
      require-error:
        # do not check ErrorIs or NotErrorIs, which are for checking error wrapping
        fn-pattern: ^(Error|Errorf|NoError|NoErrorf)$
    staticcheck:
      checks: [
          "all",
          "-ST1000",
          "-ST1003",
          "-ST1016",
          "-SA1019",
          "-ST1020",
          "-ST1021",
          "-ST1022",
          "-S1016", # struct conversion vs literal: structs with different reasons to change shouldn't be forced into a type conversion just because their fields happen to match
        ]
    gocritic:
      settings:
        rangeValCopy:
          sizeThreshold: 512 # TODO: reduce this
      enabled-checks:
        - boolExprSimplify
        - deferInLoop
        - emptyStringTest
        - rangeValCopy
        - stringXbytes
        - ruleguard

    gosec:
      excludes:
        - G115 # integer overflow conversion — too noisy for idiomatic Go
        - G117 # exported struct fields named like credentials - false positive for config structs
        - G704 # SSRF via taint analysis — false positive: HTTP adapters use config-provided URLs, not user-controlled input
    exhaustruct:
      exclude:
        - ^net/url.URL$
        - ^net/http.Server$
        - ^net/http.Client$
        - ^net/http.Transport$
        - ^net.Dialer$
        # Config structs often have many optional fields
        - .+Config$
        - .+Options$
        - .+Settings$
        - .+Params$
        - .+Input$
        - .+Request$
        - ^<anonymous>$
        - ^gorm.io/gorm/clause.OnConflict$
        - ^gorm.io/gorm/clause.Column$
        - ^gorm.io/gorm.Session$
        # AWS SDK types have many optional fields; exhausting them all is impractical
        - ^github.com/aws/aws-sdk-go-v2/service/ecs/types\..*$
        # Watermill middleware structs have many optional hook/callback fields
        - ^github.com/ThreeDotsLabs/watermill/message/router/middleware\.Retry$
  exclusions:
    rules:
      - linters: [exhaustruct]
        path: ".*_test\\.go$"
      - linters: [gosec]
        path: ".*_test\\.go$"
        text: G101 # hardcoded credentials - false positives for tests
      - linters: [revive]
        path: "oapi/"
        text: "var-naming" # oapi-codegen generates underscore package names

    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
    paths:
      - proto/generated/

formatters:
  exclusions:
    generated: lax
